<meta name="theme-color" content="#14121f">
<meta name="description" content="Sanity Run: a three-lane auto-runner where every problem is a point. 1 to 6 players, 160 gate cards.">
<title>Sanity Run</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one full-bleed canvas (split into up to six runner viewports) with DOM overlays for menus.
   Look: Jakarta dusk. Ink-indigo night, KRL signage yellow, signal red, paper-white bills. */
:root{
  --ink:#14121f; --panel:#1e1a33; --panel2:#272244; --line:#3d3764;
  --paper:#f4efe3; --mute:#a9a3c6; --sign:#ffc933; --signal:#ff4d3d; --teal:#21c7a8; --blue:#4db2ff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;background:var(--ink)}
#hb{position:absolute;top:3px;right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:3}
#hb button{font:600 12px var(--mono);color:var(--paper);background:var(--panel2);border:1px solid var(--line);border-radius:6px;height:30px;min-width:34px;padding:0 8px;cursor:pointer}
#hb button:focus-visible,.go:focus-visible,.seg button:focus-visible,.ghost:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
#ov{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(12,10,22,.88);overflow:auto;z-index:5;-webkit-user-select:none;user-select:none}
#ov.on{display:flex}
.panel{width:100%;max-width:640px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px}
.eyebrow{margin:0 0 4px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sign)}
h1{margin:0;font:800 clamp(52px,12vw,92px)/.9 var(--display);letter-spacing:.01em;text-transform:uppercase;color:var(--paper)}
h2{margin:0 0 6px;font:800 clamp(34px,7vw,52px)/1 var(--display);text-transform:uppercase}
.tag{margin:10px 0 18px;color:var(--paper)}
.tag i{color:var(--mute)}
.row{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;margin:9px 0}
.row>label{font-size:13px;color:var(--mute)}
.row>label b{display:block;color:var(--paper);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 13px var(--mono);color:var(--paper);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;min-width:42px}
.seg button[aria-pressed="true"]{background:var(--sign);color:#1b1500;border-color:var(--sign)}
.keys{margin:12px 0 4px;padding:10px 12px;background:var(--panel2);border-radius:8px;font:500 12px/1.7 var(--mono);color:var(--mute)}
.keys b{color:var(--paper);font-weight:600}
.go{display:block;width:100%;margin-top:16px;font:800 28px var(--display);letter-spacing:.04em;text-transform:uppercase;color:#1b1500;background:var(--sign);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.ghost{font:600 13px var(--mono);color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;margin-top:10px}
details{margin-top:14px;color:var(--mute);font-size:14px}
details summary{cursor:pointer;color:var(--paper);font-weight:600}
details p{margin:8px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font:500 14px var(--mono)}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.nm{font-family:var(--body);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.big{font:800 clamp(40px,10vw,64px)/1 var(--display);color:var(--sign)}
.small{font-size:13px;color:var(--mute)}
.winner{margin:6px 0 10px;font:800 30px var(--display);text-transform:uppercase;color:var(--sign)}
@media (max-width:520px){.row{grid-template-columns:1fr}.panel{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Sanity Run game screen"></canvas>
  <div id="hb"><button id="bP" aria-label="Pause">II</button><button id="bM" aria-label="Toggle sound">SFX</button></div>
  <div id="ov"></div>
</div>

  if(e.k)o.push({t:(e.k>0?'+':'−')+Math.abs(e.k)+' Kewarasan',c:e.k>0?'#21c7a8':'#ff4d3d'});
  if(e.p)o.push({t:(e.g?'Kabar Baik +':'Issue +')+e.p,c:e.g?'#ffc933':'#ff9a3d'});
  if(e.s==='m3')o.push({t:'Macet 3s',c:'#4db2ff'});
  if(e.s==='m5')o.push({t:'Macet 5s',c:'#4db2ff'});
  if(e.s==='dash')o.push({t:'Dash ×1.5',c:'#7bd88f'});
  if(e.s==='zone')o.push({t:'Pindah Zona',c:'#c58bff'});
  if(e.t)o.push({t:'Tagihan Tertunda',c:'#ff8ad8'});
  return o;
}

/* ====================== PLAYERS ====================== */
function newPlayer(i){
  return {i,pts:0,sp:0,k:CFG.kmax,burnouts:0,elim:false,deadAt:0,x:1,lane:1,j:0,jt:-1,jbuf:0,z:0,t:0,sf:1,m:1,mac:0,dash:0,inv:0,
   combo:1,chain:0,item:false,itemT:0,burnout:false,taken:new Set(),ch:[],cq:[],dyn:[],card:null,ov:[],sz:0,fl:[],toast:null,fx:{hit:0,heal:0,t:0},
   best:0}
}
function startShift(n){
  S.shift=n;S.cache.clear();S.sTime=0;S.mode='play';
  for(const p of S.players){
    if(n>1&&!p.elim)p.k=Math.min(CFG.kmax,p.k+CFG.rest);
    Object.assign(p,{z:0,t:0,x:1,lane:1,j:0,jt:-1,jbuf:0,sf:1,m:1,mac:0,dash:0,inv:0,combo:1,chain:0,item:false,itemT:0,
      burnout:p.elim,taken:new Set(),ch:[],cq:[],dyn:[],card:null,ov:[],sz:S.startZone,fl:[],toast:null,sp:0});
    p.fx={hit:0,heal:0,t:0};
  }
  hideOv();
}
function newGame(){
  S.seed=(Math.random()*1e9)|0;S.bags={};S.startZone=0;S.over=false;S.total=U.shifts;
  S.players=[];for(let i=0;i<U.n;i++)S.players.push(newPlayer(i));
  layout();startShift(1);
}

/* ====================== GAME LOGIC ====================== */
const near=(p,l)=>Math.abs(p.x-l)<0.62;
const anyLane=(p,m)=>m.some((b,l)=>b&&near(p,l));
function floater(p,txt,col){p.fl.push({t:0,txt,col});if(p.fl.length>6)p.fl.shift()}
function toast(p,txt){p.toast={t:0,txt}}
function addPts(p,base,isIssue){
  const v=Math.round(base*p.combo);p.pts+=v;p.sp+=v;floater(p,'+'+v,isIssue?'#f4efe3':'#ffc933');
  if(isIssue){
    p.chain++;
    if(p.chain>=5){p.chain=0;const prev=p.combo;p.combo=Math.min(3,p.combo+0.5);
      if(prev<2&&p.combo>=2&&!p.item){p.item=true;p.itemT=0;SFX.item()}}
  }
  return v;
}
function heal(p,n){p.k=Math.min(CFG.kmax,p.k+n);p.fx.heal=0.5;floater(p,'+'+n+' ♥','#21c7a8');SFX.heal()}
function loseK(p,n,why){
  p.combo=1;p.chain=0;p.fx.hit=0.45;p.k=Math.max(0,p.k-n);floater(p,'−'+n+' ♥','#ff4d3d');SFX.hit();
  if(p.k<=0)goBurnout(p);
}
function damage(p,n){if(p.inv>0)return false;p.inv=CFG.inv;loseK(p,n);return true}
function goBurnout(p){
  if(p.burnout)return;p.burnout=true;p.burnouts++;p.card=null;p.jt=-1;p.j=0;p.fx.t=0;SFX.burn();
  if(U.survival){p.elim=true;p.deadAt=S.total*1000+S.shift*10+S.sTime/100}
}
function startJump(p){p.jt=0;p.j=0;SFX.jump()}
function doAct(p,a){
  if(S.mode!=='play'||p.burnout)return;
  if(a==='L')p.lane=Math.max(0,p.lane-1);
  else if(a==='R')p.lane=Math.min(2,p.lane+1);
  else if(a==='J'){if(p.jt<0)startJump(p);else p.jbuf=CFG.buf}
}
function zoneOf(p){return zoneAtK(p,Math.floor(p.z/CFG.zone))}
function pickDeck(zid){return wpick(Math.random,ZONES[zid].decks)}
function triggerGate(p){
  const zid=zoneOf(p);let ci=-1,dk;
  for(let i=0;i<8;i++){
    dk=pickDeck(zid);ci=pullCard(dk);const c=CARDS[ci];
    if(c.o&&c.o.some(o=>o.s==='zone')&&(p.z%CFG.zone)>230){returnCard(dk,ci);ci=-1;continue}
    if(c.s==='zone'&&(p.z%CFG.zone)>230){returnCard(dk,ci);ci=-1;continue}
    break;
  }
  if(ci<0){dk='KEN';ci=pullCard(dk)}
  const c=CARDS[ci];
  const cd={c,dk,t:0,dur:2.2,k:Math.floor(p.z/CFG.zone),choice:!!c.o,portal:null};
  if(!cd.choice&&c.s==='zone')cd.portal=true;
  if(cd.choice&&c.o.some(o=>o.s==='zone'))cd.portal=null;
  if(cd.portal===true){const cur=zoneOf(p),o=[0,1,2,3,4,5,6].filter(z=>z!==cur);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}cd.portal=o.slice(0,3)}
  p.card=cd;SFX.card();
  if(dk==='MEM')p.mac=Math.max(p.mac,2);
  if(!cd.choice&&!cd.portal)applyEff(p,c);
}
function applyEff(p,e){
  if(e.k>0)heal(p,e.k);else if(e.k<0)loseK(p,-e.k);
  if(p.burnout)return;
  if(e.p){if(e.g){addPts(p,e.p,false);SFX.good()}else{addPts(p,e.p,true);SFX.bill()}}
  if(e.s==='m3')p.mac=Math.max(p.mac,3);
  if(e.s==='m5')p.mac=Math.max(p.mac,5);
  if(e.s==='dash')p.dash=4;
  if(e.t){addPts(p,50,false);p.cq.push(20);toast(p,'Tagihan Tertunda: Penagih datang 20 dtk lagi / Chaser in 20 s')}
}
function resolveCard(p){
  const cd=p.card;if(!cd)return;
  if(cd.choice){applyEff(p,cd.c.o[p.lane===2?1:0])}
  else if(cd.portal){const z=cd.portal[p.lane];p.ov.push([Math.floor(p.z/CFG.zone)+1,z])}
  p.card=null;
}
function spawnChaser(p){if(p.ch.length<2){p.ch.push({gap:16,x:p.lane,lock:false});toast(p,'Penagih! / Debt Collector behind you')}}
function giveBill(from){
  let tgt=null,gap=1e9;
  for(const q of S.players){if(q===from||q.burnout)continue;const g=q.z-from.z;if(g>3&&g<gap){gap=g;tgt=q}}
  if(!tgt)return false;
  tgt.dyn.push({az:tgt.z+30,lane:tgt.lane,key:'d'+(S.uid++),t:'bill'});
  from.item=false;toast(from,'Lempar Tagihan → '+PCOL[tgt.i].n);toast(tgt,'Tagihan masuk! / Incoming bill from '+PCOL[from.i].n);return true;
}
function crossEnt(p,e){
  switch(e.t){
   case 'n':case 'b':case 'd':
     if(near(p,e.lane)&&p.j<0.65){p.taken.add(e.key);addPts(p,e.t==='n'?10:e.t==='b'?25:50,true);SFX.coin()}break;
   case 'zi':{
     if(near(p,e.lane)&&p.j<0.65){p.taken.add(e.key);const Z=ZONES[e.zn].zi;addPts(p,Z.pts,true);SFX.bill();toast(p,Z.name+' / '+Z.nid);if(Z.chase)spawnChaser(p)}break}
   case 'g':if(near(p,e.lane)&&p.j<0.7){p.taken.add(e.key);addPts(p,150,false);SFX.good();toast(p,'Kabar Baik! / Good News!')}break;
   case 'sc':if(near(p,e.lane)&&p.j<0.7){p.taken.add(e.key);heal(p,1);toast(p,'Istirahat / Self-Care')}break;
   case 'pay':if(near(p,e.lane)&&p.j<0.7){p.taken.add(e.key);addPts(p,50,false);p.cq.push(20);SFX.bill();toast(p,'Tagihan Tertunda: Penagih 20 dtk lagi / Chaser in 20 s')}break;
   case 'jam':if(near(p,e.lane)){p.taken.add(e.key);p.mac=Math.max(p.mac,3);toast(p,'Macet! / Traffic Jam')}break;
   case 'trig':p.taken.add(e.key);spawnChaser(p);break;
   case 'gate':p.taken.add(e.key);triggerGate(p);break;
   case 'fence':if(anyLane(p,e.m)&&p.j<0.42){p.taken.add(e.key);damage(p,1)}break;
   case 'car':case 'banner':if(anyLane(p,e.m)){p.taken.add(e.key);damage(p,1)}break;
   case 'meet':if(anyLane(p,e.m)){p.taken.add(e.key);damage(p,2)}break;
  }
}
function updPlayer(p,dt){
  p.fx.t+=dt;p.fx.hit=Math.max(0,p.fx.hit-dt);p.fx.heal=Math.max(0,p.fx.heal-dt);
  for(const f of p.fl)f.t+=dt;p.fl=p.fl.filter(f=>f.t<1.1);
  if(p.toast){p.toast.t+=dt;if(p.toast.t>2.6)p.toast=null}
  if(p.burnout)return;
  p.t+=dt;p.sf=Math.min(CFG.cap,1+CFG.step*Math.floor(p.t/CFG.every));
  let m=1;if(p.mac>0){m*=0.5;p.mac-=dt}if(p.dash>0){m*=1.5;p.dash-=dt}p.m=m;
  const z0=p.z;p.z+=p.sf*m*CFG.base*dt;
  const dx=p.lane-p.x,mx=dt/CFG.lc;p.x+=Math.abs(dx)<=mx?dx:Math.sign(dx)*mx;
  if(p.jt>=0){p.jt+=dt;if(p.jt>=CFG.air){p.jt=-1;p.j=0;if(p.jbuf>0){p.jbuf=0;startJump(p)}}else p.j=Math.sin(Math.PI*p.jt/CFG.air)}
  if(p.jbuf>0)p.jbuf-=dt;
  if(p.inv>0)p.inv-=dt;
  const k0=Math.floor(z0/CFG.zone),k1=Math.floor(p.z/CFG.zone);
  for(let k=k0;k<=k1&&!p.burnout;k++){
    if(!chunkVisible(p,k))continue;
    for(const e of getChunk(p,k).ents){
      if(e.az<=z0)continue;if(e.az>p.z)break;
      if(p.taken.has(e.key))continue;
      crossEnt(p,e);if(p.burnout)break;
    }
  }
  for(const d of p.dyn){
    if(d.done)continue;
    if(d.az>z0&&d.az<=p.z){d.done=true;if(near(p,d.lane)&&p.inv<=0){damage(p,1);if(!p.burnout){p.pts+=10;p.sp+=10;floater(p,'+10','#f4efe3')}}}
  }
  p.dyn=p.dyn.filter(d=>!d.done&&d.az>p.z-10);
  for(let i=p.cq.length-1;i>=0;i--){p.cq[i]-=dt;if(p.cq[i]<=0){p.cq.splice(i,1);spawnChaser(p)}}
  for(const c of p.ch){
    c.gap-=0.2*CFG.base*dt;
    if(!c.lock){const d=p.lane-c.x,mm=3*dt;c.x+=Math.abs(d)<=mm?d:Math.sign(d)*mm;if(c.gap<5)c.lock=true}
    if(c.gap<=0.6){c.done=true;if(Math.abs(p.x-c.x)<0.6&&p.j<0.45&&p.inv<=0){p.inv=CFG.inv;loseK(p,2);toast(p,'Tertangkap Penagih! / Caught')}}
  }
  p.ch=p.ch.filter(c=>!c.done);
  if(p.card){
    p.card.t+=dt;
    if(p.card.portal&&Math.floor(p.z/CFG.zone)>p.card.k)resolveCard(p);
    else if(p.card.t>=p.card.dur)resolveCard(p);
  }
  if(p.item){p.itemT+=dt;if(S.players.length>1&&p.itemT>0.7)giveBill(p)}
}
function standings(){
  const a=S.players.slice();
  if(U.survival)a.sort((x,y)=>(x.elim-y.elim)||(y.k-x.k)||(y.deadAt-x.deadAt)||(y.pts-x.pts));
  else a.sort((x,y)=>(y.pts-x.pts)||(y.k-x.k)||(x.burnouts-y.burnouts));
  return a;
}
function alive(){return S.players.filter(p=>!p.elim)}
function update(dt){
  if(S.mode==='play'){
    S.sTime+=dt;
    for(const p of S.players)updPlayer(p,dt);
    const act=S.players.filter(p=>!p.burnout);
    let end=S.sTime>=U.len||act.length===0;
    if(U.survival&&S.players.length>1&&alive().length<=1)end=true;
    if(end)endShift();
  }
}
function endShift(){
  let lead=S.players[0];for(const p of S.players)if(p.z>lead.z)lead=p;
  const nextZone=(zoneAtK(lead,Math.floor(lead.z/CFG.zone))+1)%7;
  let over=S.shift>=U.shifts;
  if(U.survival){const a=alive();if(S.players.length>1?a.length<=1:a.length===0)over=true}
  if(over){finish();return}
  S.startZone=nextZone;S.mode='meeting';S.meetT=CFG.meet;showMeeting();
}
function finish(){
  S.mode='end';S.over=true;
  const st=standings();
  if(S.players.length===1&&!U.survival&&S.players[0].pts>S.best){S.best=S.players[0].pts;try{localStorage.setItem('sanityrun.best',String(S.best))}catch(e){}}
  showEnd(st);
}

const keyMap={};
KEYSETS.forEach((ks,i)=>{['L','R','J'].forEach(a=>ks[a].forEach(c=>keyMap[c]=[i,a]))});
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'||(e.code==='KeyP'&&S.mode!=='menu')){if(S.mode==='play'||S.mode==='paused'){togglePause();e.preventDefault()}return}

/* gamepads: pad n drives player n */
const padState={};
function pollPads(){
  let pads;try{pads=navigator.getGamepads?navigator.getGamepads():[]}catch(e){return}
  for(let i=0;i<S.players.length;i++){
    const g=pads&&pads[i];if(!g)continue;
    const st=padState[i]||(padState[i]={l:false,r:false,j:false});
    const ax=g.axes[0]||0,b=n=>g.buttons[n]&&g.buttons[n].pressed;
    const l=ax<-0.5||b(14),r=ax>0.5||b(15),j=b(0)||b(12)||b(1)||(g.axes[1]||0)<-0.6;
    if(l&&!st.l)doAct(S.players[i],'L');if(r&&!st.r)doAct(S.players[i],'R');if(j&&!st.j)doAct(S.players[i],'J');
    st.l=l;st.r=r;st.j=j;
  }
}
/* touch / pointer: swipes inside a runner's viewport, plus optional on-screen buttons */
const ptrs=new Map();
const showBtns=()=>U.touch==='on'||(U.touch==='auto'&&isTouch);
function btnRects(v){
  const r=clamp(Math.min(v.w*0.1,v.h*0.09,34),16,34),y=v.y+v.h-r*1.5,pad=r*0.4;
  return [{a:'L',x:v.x+r*1.3,y,r},{a:'R',x:v.x+r*3.6+pad,y,r},{a:'J',x:v.x+v.w-r*1.5,y,r}];
}
function viewAt(x,y){for(const v of views)if(x>=v.x&&x<v.x+v.w&&y>=v.y&&y<v.y+v.h)return v;return null}
cv.addEventListener('pointerdown',e=>{
  if(S.mode!=='play')return;
  initAudio();
  const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top,v=viewAt(x,y);if(!v)return;
  const p=S.players[v.i];if(!p)return;
  if(showBtns()){for(const b of btnRects(v)){if(Math.hypot(x-b.x,y-b.y)<=b.r*1.35){doAct(p,b.a);ptrs.set(e.pointerId,{btn:true});try{cv.setPointerCapture(e.pointerId)}catch(_){ }return}}}
  ptrs.set(e.pointerId,{p,x0:x,y0:y,done:false});try{cv.setPointerCapture(e.pointerId)}catch(_){ }
});
cv.addEventListener('pointermove',e=>{
  const s=ptrs.get(e.pointerId);if(!s||s.btn)return;
  const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top,dx=x-s.x0,dy=y-s.y0,T=26;
  if(Math.abs(dx)>=T&&Math.abs(dx)>Math.abs(dy)){doAct(s.p,dx<0?'L':'R');s.x0=x;s.y0=y}
  else if(dy<=-T&&Math.abs(dy)>Math.abs(dx)){doAct(s.p,'J');s.x0=x;s.y0=y}
});
const upP=e=>{ptrs.delete(e.pointerId)};
cv.addEventListener('pointerup',upP);cv.addEventListener('pointercancel',upP);
cv.addEventListener('contextmenu',e=>e.preventDefault());

function layout(){
  const wrap=$('#app');W=wrap.clientWidth;H=wrap.clientHeight;dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const n=Math.max(1,S.players.length||U.n),ax=0,ay=topH+stripH,aw=W,ah=H-ay;
  let best=null;
  for(let cols=1;cols<=n;cols++){const rows=Math.ceil(n/cols),f=Math.min(ah/rows,0.92*aw/cols);if(!best||f>best.f)best={cols,rows,f}}
  views=[];const gap=n>1?4:0,cw=(aw-gap*(best.cols-1))/best.cols,ch=(ah-gap*(best.rows-1))/best.rows;
  for(let i=0;i<n;i++){const c=i%best.cols,r=Math.floor(i/best.cols);views.push({i,x:ax+c*(cw+gap),y:ay+r*(ch+gap),w:cw,h:ch})}
}
new ResizeObserver(layout).observe($('#app'));
window.addEventListener('resize',layout);

const FD='800 {px}px "Big Shoulders Display","Arial Narrow",Impact,sans-serif';
const FM='600 {px}px "IBM Plex Mono",ui-monospace,Menlo,monospace';

const fd=px=>FD.replace('{px}',px),fm=px=>FM.replace('{px}',px),fb=(px,w)=>FB.replace('{px}',px).replace('{w}',w||'400');
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(0.5,r),0,6.2832);c.fill()}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(0.5,rx),Math.max(0.5,ry),0,0,6.2832);c.fill()}
function txt(c,s,x,y,font,col,al,bl){c.font=font;c.fillStyle=col;c.textAlign=al||'left';c.textBaseline=bl||'alphabetic';c.fillText(s,x,y)}
function wrap(c,s,maxW){const w=s.split(' '),L=[];let cur='';for(const t of w){const n=cur?cur+' '+t:t;if(c.measureText(n).width>maxW&&cur){L.push(cur);cur=t}else cur=n}if(cur)L.push(cur);return L}

   case 'kos':{const h=h0*(0.28+0.34*r1),w=bw*0.82;c.fillRect(x,hy-h,w,h);c.beginPath();c.moveTo(x-bw*0.04,hy-h);c.lineTo(x+w/2,hy-h-h*0.28);c.lineTo(x+w+bw*0.04,hy-h);c.fill();
     c.fillStyle=z.win;for(let i=0;i<2;i++)if(((r2*8)|0)>>i&1)c.fillRect(x+w*(0.2+0.4*i),hy-h*0.65,w*0.18,h*0.2);
     if(r2>0.55){c.strokeStyle='#cbb';c.lineWidth=1;c.beginPath();c.moveTo(x+w,hy-h*0.45);c.lineTo(x+bw*1.1,hy-h*0.4);c.stroke();c.fillStyle=['#ff6b57','#4db2ff','#ffc933'][(r2*10|0)%3];c.fillRect(x+w+bw*0.06,hy-h*0.4,bw*0.07,h*0.12)}break}
   case 'station':{c.fillRect(x,hy-h0*0.34,bw,h0*0.1);c.fillRect(x+bw*0.1,hy-h0*0.24,bw*0.05,h0*0.24);c.fillRect(x+bw*0.8,hy-h0*0.24,bw*0.05,h0*0.24);

function drawView(p,v,tm){

    c.beginPath();c.moveTo(xl0,y0);c.lineTo(xr0,y0);c.lineTo(xr1,y1);c.lineTo(xl1,y1);c.closePath();c.fill();
  }
  /* road edges + lane dividers (second pass for crispness) */
  for(let i=BANDS.length-1;i>=0;i--){
    const [d0,d1]=BANDS[i],a0=camZ+d0,s0=f/d0,s1=f/d1,y0=hy+CFG.camH*s0,y1=hy+CFG.camH*s1;
    c.fillStyle='#ffc933';
    for(const sd of [-1,1]){const xa=cx+(sd*half-camX)*s0,xb=cx+(sd*half-camX)*s1;c.beginPath();c.moveTo(xa-0.07*s0,y0);c.lineTo(xa+0.07*s0,y0);c.lineTo(xb+0.07*s1,y1);c.lineTo(xb-0.07*s1,y1);c.closePath();c.fill()}
    if(Math.floor(a0/4)%2===0){c.fillStyle='rgba(244,239,227,.55)';
      for(const dl of [-CFG.lane/2,CFG.lane/2]){const xa=cx+(dl-camX)*s0,xb=cx+(dl-camX)*s1;c.beginPath();c.moveTo(xa-0.05*s0,y0);c.lineTo(xa+0.05*s0,y0);c.lineTo(xb+0.05*s1,y1);c.lineTo(xb-0.05*s1,y1);c.closePath();c.fill()}}
  }
  /* collect drawables */
  const items=[];
  const i0=Math.floor((camZ+1)/12),i1=Math.floor((camZ+CFG.view)/12);
  for(let i=i0;i<=i1;i++){const az=i*12,dz=az-camZ;if(dz<1)continue;items.push({dz,k:'dec',az,i,side:-1});items.push({dz,k:'dec',az,i,side:1})}
  const k0=Math.floor(camZ/CFG.zone),k1=Math.floor((camZ+CFG.view)/CFG.zone);
  for(let k=Math.max(0,k0);k<=k1;k++){
    if(!chunkVisible(p,k))continue;
    for(const e of getChunk(p,k).ents){const dz=e.az-camZ;if(dz<1||dz>CFG.view||p.taken.has(e.key)||e.t==='trig')continue;items.push({dz:e.t==='jam'?dz+8:dz,k:'e',e})}
  }
  for(const d of p.dyn){const dz=d.az-camZ;if(dz>1&&dz<CFG.view)items.push({dz,k:'dyn',d})}
  for(const ch of p.ch){const dz=CFG.back-ch.gap;if(dz>0.9)items.push({dz,k:'ch',ch})}
  items.push({dz:CFG.back,k:'pl'});
  items.sort((a,b)=>b.dz-a.dz);
  for(const it of items){
    const fade=clamp((CFG.view-it.dz)/45,0,1);c.globalAlpha=fade;
    if(it.k==='dec'){const [sx,sy,s]=P(it.side*(half+1.4),0,it.az);roadDeco(c,Z,sx,sy,s,it.side,it.i)}
    else if(it.k==='e'){const e=it.e;if(MULTI.has(e.t)){drawEnt(c,p,e,0,0,0,tm,P,camZ,it.dz)}
      else{const [sx,sy,s]=P((e.lane-1)*CFG.lane,0,e.az);drawEnt(c,p,e,sx,sy,s,tm,P,camZ,it.dz)}}
    else if(it.k==='dyn'){const d=it.d,[sx,sy,s]=P((d.lane-1)*CFG.lane,0,d.az);ell(c,sx,sy,0.9*s,0.16*s,'rgba(0,0,0,.3)');c.fillStyle='#f4efe3';rr(c,sx-0.7*s,sy-1.5*s,1.4*s,1.5*s,0.06*s);c.fill();c.fillStyle='#d4332a';c.fillRect(sx-0.7*s,sy-1.5*s,1.4*s,0.38*s);
      if(s>10)txt(c,'TAGIHAN!',sx,sy-0.6*s,fd(Math.round(0.42*s)),'#d4332a','center','middle');c.fillStyle='#b9b3a0';for(let q=0;q<2;q++)c.fillRect(sx-0.5*s,sy-0.95*s+q*0.18*s-0.0,1.0*s,0.04*s)}
    else if(it.k==='ch'){const ch=it.ch,[sx,sy,s]=P((ch.x-1)*CFG.lane,0,p.z-ch.gap);drawChaser(c,sx,sy,s,tm)}
    else{const [sx,sy,s]=P((p.x-1)*CFG.lane,0,p.z);drawRunner(c,p,sx,sy,s,tm)}
    c.globalAlpha=1;
  }
  /* chaser warnings at the bottom edge */
  for(const ch of p.ch){
    const [sx,,s]=P((ch.x-1)*CFG.lane,0,camZ+CFG.back*0.9);const secs=Math.max(0,ch.gap/(0.2*CFG.base));
    const yy=vh-clamp(vh*0.06,18,40),sz=clamp(f*0.07,12,30)*(1+Math.sin(tm*10)*0.12*(secs<4?1:0));
    c.fillStyle='#ff4d3d';c.beginPath();c.moveTo(sx,yy-sz);c.lineTo(sx+sz*0.9,yy+sz*0.5);c.lineTo(sx-sz*0.9,yy+sz*0.5);c.closePath();c.fill();
    txt(c,String(Math.ceil(secs)),sx,yy+sz*0.15,fm(Math.round(sz*0.8)),'#fff','center','middle');
  }
  /* effects */
  if(p.dash>0){c.strokeStyle='rgba(244,239,227,.35)';c.lineWidth=2;for(let i=0;i<14;i++){const a=hash(i,Math.floor(tm*20))%1000/1000,xx=a*vw;c.beginPath();c.moveTo(xx,hy);c.lineTo(cx+(xx-cx)*1.8,vh);c.stroke()}}
  if(p.mac>0){c.fillStyle='rgba(60,60,90,.18)';c.fillRect(0,0,vw,vh)}
  if(p.fx.hit>0){const a=p.fx.hit/0.45;c.fillStyle='rgba(255,40,40,'+(0.35*a)+')';c.fillRect(0,0,vw,vh);}
  if(p.fx.heal>0){c.fillStyle='rgba(33,199,168,'+(0.2*p.fx.heal/0.5)+')';c.fillRect(0,0,vw,vh)}
  if(p.k<=3&&!p.burnout){const a=0.12+0.08*Math.sin(tm*6);const rg=c.createRadialGradient(cx,vh/2,vh*0.3,cx,vh/2,vh*0.8);rg.addColorStop(0,'rgba(255,40,40,0)');rg.addColorStop(1,'rgba(255,40,40,'+(a*2)+')');c.fillStyle=rg;c.fillRect(0,0,vw,vh)}
  drawHUD(p,v,tm,f);
  c.restore();
}

function drawHUD(p,v,tm,f){
  const c=ctx,vw=v.w,vh=v.h,fs=clamp(Math.min(vw,vh*1.1)/26,10,19),pad=fs*0.7,A=PCOL[p.i];
  /* player tag */
  c.fillStyle=A.c;rr(c,vw/2-fs*1.3,pad*0.5,fs*2.6,fs*1.4,fs*0.3);c.fill();txt(c,A.n,vw/2,pad*0.5+fs*0.72,fd(Math.round(fs*1.15)),'#16141c','center','middle');
  /* points */
  txt(c,'POIN · POINTS',pad,pad+fs*0.7,fm(Math.round(fs*0.62)),'#cfc9ea','left');
  txt(c,fmt(p.pts),pad,pad+fs*2.7,fd(Math.round(fs*2.5)),'#f4efe3','left');
  /* kewarasan pips */
  const py=pad+fs*3.3,pw=Math.min(fs*1.15,(vw*0.46)/10),col=p.k>6?'#21c7a8':p.k>3?'#ffc933':'#ff4d3d';
  txt(c,'KEWARASAN · SANITY',pad,py+fs*0.5,fm(Math.round(fs*0.62)),'#cfc9ea','left');
  for(let i=0;i<10;i++){c.fillStyle=i<p.k?col:'rgba(255,255,255,.14)';rr(c,pad+i*(pw+2),py+fs*0.8,pw,fs*0.95,2);c.fill()}
  /* combo */
  const rx=vw-pad;
  txt(c,'COMBO',rx,pad+fs*0.7,fm(Math.round(fs*0.62)),'#cfc9ea','right');
  txt(c,'×'+(p.combo%1?p.combo.toFixed(1):p.combo.toFixed(0)),rx,pad+fs*2.7,fd(Math.round(fs*2.5)),p.combo>=2?'#ffc933':'#f4efe3','right');
  for(let i=0;i<5;i++){c.fillStyle=i<p.chain?'#ffc933':'rgba(255,255,255,.16)';c.fillRect(rx-(5-i)*(fs*0.62)+fs*0.1,pad+fs*3.15,fs*0.5,fs*0.3)}
  if(S.players.length>1){
    const bx=rx-fs*1.6,by=pad+fs*4.0;c.strokeStyle=p.item?'#ffc933':'rgba(255,255,255,.2)';c.lineWidth=1.5;rr(c,bx,by,fs*1.6,fs*1.6,4);c.stroke();
    if(p.item){c.fillStyle='#f4efe3';rr(c,bx+fs*0.4,by+fs*0.28,fs*0.8,fs*1.05,2);c.fill();c.fillStyle='#d4332a';c.fillRect(bx+fs*0.4,by+fs*0.28,fs*0.8,fs*0.25)}
    txt(c,'LEMPAR',bx-fs*0.3,by+fs*1.05,fm(Math.round(fs*0.55)),p.item?'#ffc933':'#6f6a8f','right');
  }
  /* zone + speed band */
  const Z=ZONES[zoneOf(p)],b=bandOf(p.sf*p.m);
  const by=vh-pad-(showBtns()?Math.min(vh*0.2,76):0);
  txt(c,Z.en.toUpperCase(),pad,by-fs*1.05,fd(Math.round(fs*1.3)),'#f4efe3','left');
  txt(c,Z.id,pad,by-fs*0.1,fb(Math.round(fs*0.8),'400'),'#cfc9ea','left');
  txt(c,b[0].toUpperCase()+' · '+(p.sf*p.m).toFixed(2)+'×',vw-pad,by-fs*0.1,fm(Math.round(fs*0.68)),b[2],'right');
  /* toast */
  if(p.toast){const a=clamp(1.2-p.toast.t/2.6,0,1);c.globalAlpha=a;c.font=fb(Math.round(fs*0.85),'600');const w=Math.min(vw-pad*2,c.measureText(p.toast.txt).width+fs*1.6);
    c.fillStyle='rgba(20,18,31,.88)';rr(c,vw/2-w/2,vh*0.7,w,fs*1.9,6);c.fill();txt(c,p.toast.txt,vw/2,vh*0.7+fs*0.98,fb(Math.round(fs*0.85),'600'),'#f4efe3','center','middle');c.globalAlpha=1}
  /* floaters */
  for(const fl of p.fl){const a=1-fl.t/1.1;c.globalAlpha=Math.max(0,a);txt(c,fl.txt,vw/2+(p.x-1)*vw*0.12,vh*0.62-fl.t*fs*3,fd(Math.round(fs*1.5)),fl.col,'center');c.globalAlpha=1}
  /* card pop-up */
  if(p.card)drawCard(p,vw,vh,fs);
  /* burnout */
  if(p.burnout){
    c.fillStyle='rgba(18,16,30,.55)';c.fillRect(0,0,vw,vh);
    const bw=Math.min(vw-pad*2,fs*22);c.fillStyle='#1e1a33';rr(c,vw/2-bw/2,vh*0.3,bw,fs*7.4,10);c.fill();c.strokeStyle='#ff4d3d';c.lineWidth=2;c.stroke();
    txt(c,'BURNOUT',vw/2,vh*0.3+fs*2.6,fd(Math.round(fs*3)),'#ff4d3d','center','middle');
    txt(c,U.survival?'Tereliminasi · Eliminated':'Klinik Burnout · kembali di Shift berikutnya',vw/2,vh*0.3+fs*4.5,fb(Math.round(fs*0.8),'600'),'#f4efe3','center','middle');
    txt(c,U.survival?'You are out of the run.':'Back next Shift at 3 Kewarasan. Points stay.',vw/2,vh*0.3+fs*5.6,fb(Math.round(fs*0.78),'400'),'#a9a3c6','center','middle');
  }
  /* touch buttons */
  if(showBtns()&&!p.burnout){
    for(const b of btnRects(v)){const bx=b.x-v.x,by2=b.y-v.y;c.fillStyle='rgba(244,239,227,.14)';circ(c,bx,by2,b.r,'rgba(244,239,227,.14)');c.strokeStyle='rgba(244,239,227,.4)';c.lineWidth=1.5;c.beginPath();c.arc(bx,by2,b.r,0,6.2832);c.stroke();
      c.fillStyle='rgba(244,239,227,.8)';c.beginPath();const q=b.r*0.4;
      if(b.a==='L'){c.moveTo(bx+q*0.8,by2-q);c.lineTo(bx-q,by2);c.lineTo(bx+q*0.8,by2+q)}else if(b.a==='R'){c.moveTo(bx-q*0.8,by2-q);c.lineTo(bx+q,by2);c.lineTo(bx-q*0.8,by2+q)}else{c.moveTo(bx-q,by2+q*0.8);c.lineTo(bx,by2-q);c.lineTo(bx+q,by2+q*0.8)}
      c.closePath();c.fill()}
  }
}
function drawCard(p,vw,vh,fs){
  const c=ctx,cd=p.card,card=cd.c,D=DECKS[cd.dk],t=cd.t,a=clamp(Math.min(t/0.15,(cd.dur-t)/0.25+0.4,1),0,1);
  c.globalAlpha=a;
  const w=Math.min(vw-fs*1.2,fs*26),x=vw/2-w/2;let y=vh*0.2,px=fs*0.9,tw=w-px*2;
  c.font=fb(Math.round(fs*1.25),'600');const l1=wrap(c,card.en,tw);
  c.font=fb(Math.round(fs*0.95),'400');const l2=wrap(c,card.id,tw);
  const eff=cd.choice?null:cd.portal?[{t:'Pindah Zona',c:'#c58bff'}]:effList(card);
  let h=fs*2.0+l1.length*fs*1.5+l2.length*fs*1.25+fs*1.0+(cd.choice||cd.portal?fs*4.2:fs*2.0);
  c.fillStyle='rgba(20,18,31,.95)';rr(c,x,y,w,h,10);c.fill();c.fillStyle=D.col;rr(c,x,y,w,fs*1.45,10);c.fill();c.fillRect(x,y+fs*0.8,w,fs*0.65);
  txt(c,(D.en+' · '+D.id).toUpperCase(),x+px,y+fs*0.74,fm(Math.round(fs*0.7)),'#16141c','left','middle');
  let yy=y+fs*2.5;
  c.font=fb(Math.round(fs*1.25),'600');for(const l of l1){txt(c,l,x+px,yy,fb(Math.round(fs*1.25),'600'),'#f4efe3','left');yy+=fs*1.5}
  for(const l of l2){txt(c,l,x+px,yy,fb(Math.round(fs*0.95),'400'),'#a9a3c6','left');yy+=fs*1.25}
  yy+=fs*0.35;
  if(eff){let cx2=x+px;for(const e of eff){c.font=fm(Math.round(fs*0.78));const cw=c.measureText(e.t).width+fs*1.0;
      c.fillStyle=e.c;rr(c,cx2,yy,cw,fs*1.45,5);c.fill();txt(c,e.t,cx2+cw/2,yy+fs*0.75,fm(Math.round(fs*0.78)),'#14121f','center','middle');cx2+=cw+fs*0.5}}
  else{
    const opts=cd.portal?cd.portal.map(z=>[{t:ZONES[z].id,c:'#c58bff'}]):card.o.map(effList);
    const n=opts.length,cw=(tw-(n-1)*fs*0.4)/n;
    const sel=cd.portal?p.lane:(p.lane===2?1:0);
    opts.forEach((o,i)=>{const ox=x+px+i*(cw+fs*0.4);const on=i===sel;
      c.fillStyle=on?'rgba(255,201,51,.18)':'rgba(255,255,255,.05)';rr(c,ox,yy,cw,fs*3.6,6);c.fill();c.strokeStyle=on?'#ffc933':'rgba(255,255,255,.18)';c.lineWidth=on?2:1;c.stroke();
      let oy=yy+fs*0.4;for(const e of o){c.font=fm(Math.round(fs*0.7));txt(c,e.t,ox+cw/2,oy+fs*0.4,fm(Math.round(fs*0.7)),e.c,'center','middle');oy+=fs*0.95}
      txt(c,cd.portal?(i===0?'◀ kiri':i===1?'tengah':'kanan ▶'):(i===0?'◀ kiri / left':'kanan / right ▶'),ox+cw/2,yy+fs*3.2,fm(Math.round(fs*0.55)),'#a9a3c6','center','middle')});
  }
  c.globalAlpha=1;
}

function drawTop(tm){

function rankTable(st,withK){
  return '<table><thead><tr><th>Runner</th><th>Points</th><th>Kewarasan</th><th>Burnouts</th></tr></thead><tbody>'
   +st.map((p,i)=>'<tr><td class="nm"><span class="dot" style="background:'+PCOL[p.i].c+'"></span>'+(i+1)+'. '+PCOL[p.i].n+(p.elim?' · out':'')+'</td><td>'+fmt(p.pts)+'</td><td>'+p.k+'/10</td><td>'+p.burnouts+'</td></tr>').join('')+'</tbody></table>';
}
function showMeeting(){
  const st=standings(),Zn=ZONES[S.startZone];
  showOv('<div class="panel"><p class="eyebrow">Rapat Pagi · Morning Meeting</p><h2>Shift '+S.shift+' done</h2>'
   +'<p class="small">Selesai. Everyone recovers 3 Kewarasan overnight (max 10). Burnout runners return at 3.</p>'
   +rankTable(st)
   +'<p class="small">Shift '+(S.shift+1)+' starts in <b style="color:var(--paper)">'+Zn.en+'</b> · '+Zn.id+'.</p>'
   +'<p class="big" id="mt">'+mmss(S.meetT)+'</p>'
   +'<button class="go" id="nx" type="button">Start Shift '+(S.shift+1)+' · Mulai</button>'
   +'<button class="ghost" id="qt" type="button">Quit to menu</button></div>');
  $('#nx').addEventListener('click',()=>startShift(S.shift+1));
  $('#qt').addEventListener('click',()=>{S.mode='menu';showMenu()});
  $('#nx').focus({preventScroll:true});
}
function showEnd(st){
  const w=st[0];let head;
  if(S.players.length===1){head=U.survival?(w.elim?'You burned out':'You survived all Shifts'):('Final score '+fmt(w.pts))}
  else head=PCOL[w.i].n+' wins';
  const newBest=S.players.length===1&&!U.survival&&w.pts>=S.best&&w.pts>0;
  showOv('<div class="panel"><p class="eyebrow">Tamat · Game over</p><h2>'+head+'</h2>'
   +(newBest?'<div class="winner">New best score</div>':'<div class="winner">'+(U.survival?'Last sane runner':'Most points')+'</div>')
   +rankTable(st)
   +'<p class="small">Points only went up. Kewarasan was the real cost. / Poin cuma naik. Kewarasan yang jadi bayarannya.</p>'
   +'<button class="go" id="again" type="button">Play again · Main lagi</button>'
   +'<button class="ghost" id="mn" type="button">Menu</button></div>');
  $('#again').addEventListener('click',()=>newGame());
  $('#mn').addEventListener('click',()=>{S.mode='menu';showMenu()});
}
function togglePause(){
  if(S.mode==='play'){S.mode='paused';showOv('<div class="panel"><p class="eyebrow">Jeda · Paused</p><h2>Paused</h2><button class="go" id="rs" type="button">Resume · Lanjut</button><button class="ghost" id="qm" type="button">Quit to menu</button></div>');
    $('#rs').addEventListener('click',togglePause);$('#qm').addEventListener('click',()=>{S.mode='menu';showMenu()});$('#rs').focus({preventScroll:true})}
  else if(S.mode==='paused'){S.mode='play';hideOv()}
}
$('#bP').addEventListener('click',()=>{if(S.mode==='play'||S.mode==='paused')togglePause()});
$('#bM').addEventListener('click',()=>{U.sound=!U.sound;$('#bM').style.opacity=U.sound?1:0.5;initAudio()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')togglePause()});

/* ====================== LOOP ====================== */
let last=0;
function frame(ts){
  const tm=ts/1000,dt=Math.min(0.05,last?tm-last:0);last=tm;
  if(S.mode==='play')pollPads();
  if(S.mode==='meeting'){S.meetT-=dt;const el=$('#mt');if(el)el.textContent=mmss(S.meetT);if(S.meetT<=0)startShift(S.shift+1)}
  try{update(dt);render(tm)}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
layout();showMenu();
requestAnimationFrame(frame);
window.__sr={S,U,CFG,ZONES,newGame,startShift,doAct,update,standings,getChunk,zoneOf};
})();
</script>

</html>
